<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grab a coffee in SF · OpenWork</title>
    <meta name="description" content="Put your email address and we'll send you a time to grab a coffee with the OpenWork team in San Francisco." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="root">
      <section class="stage" id="stage">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="vignette" aria-hidden="true"></div>

        <div class="card" id="card">
          <p class="eyebrow">coffee.openworklabs.com/sf</p>
          <h1>Grab a coffee in San&nbsp;Francisco</h1>
          <p class="lede">Put your email address and we'll send you a time to grab a coffee with the OpenWork team.</p>
          <form id="form" novalidate>
            <label for="email" class="sr-only">Email address</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Put your email address" required />
            <button type="submit" id="submit">Grab a coffee</button>
          </form>
          <p class="error" id="error" role="alert" hidden></p>
        </div>

        <article class="receipt" id="receipt" hidden aria-live="polite">
          <header>
            <span>OPENWORK COFFEE</span>
            <span>SF</span>
          </header>
          <div class="rule"></div>
          <div id="receipt-body"></div>
          <div class="rule"></div>
          <footer id="receipt-footer"></footer>
        </article>
      </section>

      <section class="install" id="install" hidden>
        <div class="install-inner">
          <h2>Add it to your agent</h2>
          <p class="install-lede">One URL. No API key. Then say <em>"grab a coffee with OpenWork."</em></p>
          <div class="url-row">
            <code id="mcp-url"></code>
            <button type="button" class="copy" data-copy-target="mcp-url">Copy</button>
          </div>
          <div class="tabs" role="tablist" id="tabs"></div>
          <div class="panel" id="panel"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
